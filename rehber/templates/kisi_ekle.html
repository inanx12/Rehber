<!DOCTYPE html>
<html>
<head>
    <title>Kişi Ekle</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kisi_ekle.css') }}">
    <body style="background-image: url('{{ url_for('static', filename='image/background.jpeg') }}'); background-size: cover; background-repeat: no-repeat; background-position: center;">
</head>
<body>
    <h1>Kişi Ekle</h1>
    <form method="POST" action="/kisi_ekle">
        <label>Ad Soyad:</label><br>
        <input type="text" name="ad_soyad" required><br>
        <label>Eposta:</label><br>
        <input type="email" name="eposta" required><br>
        <label>Telefon:</label><br>
        <input type="text" name="telefon" required><br>
        <label>Unvan:</label><br>
        <input type="text" name="unvan"><br>
        <label>Açıklama:</label><br>
        <textarea name="aciklama"></textarea><br>
        <button type="submit">Kaydet</button>
    </form>
    <a href="/">Geri Dön</a>
</body>
</html>
